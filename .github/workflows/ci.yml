name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.0"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras --frozen
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-extras --frozen
      - name: Run tests
        env:
          ENVIRONMENT: test
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # The test suite runs on SQLite, so these jobs are what actually prove the
  # PostgreSQL and MongoDB code paths work.
  backends:
    name: Backend — ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            extra: ""
          - backend: mongodb
            extra: "--extra mongodb"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync ${{ matrix.extra }} --frozen

      - name: Apply migrations
        if: matrix.backend == 'postgres'
        env:
          DB_BACKEND: postgres
          DB_PASSWORD: postgres
        run: uv run alembic upgrade head

      - name: Run the cross-backend repository contract tests
        env:
          DB_BACKEND: ${{ matrix.backend }}
          DB_PASSWORD: postgres
        run: uv run ${{ matrix.extra }} pytest tests/integration/test_repository_contract.py -v

      - name: Boot the app and probe it
        env:
          DB_BACKEND: ${{ matrix.backend }}
          DB_PASSWORD: postgres
        run: |
          uv run ${{ matrix.extra }} python -m app &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/v1/health/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -sf -X POST http://127.0.0.1:8000/api/v1/users \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","email":"ci@example.com"}' | grep -q '"username":"ci_user"'

  setup-script:
    name: setup.sh on a bare machine
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # No uv, no database, no .env — exactly what a new contributor has.
      - name: Run setup
        run: ./scripts/setup.sh --yes
      - name: The app must start and answer
        run: |
          uv run python -m app &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'
