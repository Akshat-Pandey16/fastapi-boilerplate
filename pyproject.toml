[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "Production-grade FastAPI boilerplate with async SQLAlchemy 2.0, Pydantic v2, and modern Python tooling."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "FastAPI Boilerplate" }]
keywords = ["fastapi", "boilerplate", "sqlalchemy", "asyncpg", "pydantic", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "fastapi[standard]>=0.141.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "alembic>=1.18.0",
    "structlog>=26.1.0",
    # Bundled drivers: PostgreSQL for production, SQLite so a fresh clone runs
    # with no database server at all. MySQL and MongoDB are extras below.
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.3.0"]
mongodb = ["pymongo>=4.17.0"]

[project.urls]
Homepage = "https://github.com/your-org/fastapi-boilerplate"
Issues = "https://github.com/your-org/fastapi-boilerplate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Development dependencies (PEP 735). Installed by a plain `uv sync`;
# excluded from deployments with `uv sync --no-dev`.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    # Lets the MongoDB tests run locally; they skip when no server is reachable.
    "pymongo>=4.17.0",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces black, isort, flake8, pyupgrade, ...)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "A",     # flake8-builtins
    "PIE",   # flake8-pie
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "PL",    # pylint
    "PT",    # pytest-style
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
]
ignore = [
    "PLR0913", # too many arguments — FastAPI endpoints intentionally take many deps
    "S101",    # use of assert (fine in tests)
    "B008",    # function call in default arg (FastAPI Depends pattern)
    "TC001",   # imports must be runtime-resolvable for FastAPI/Pydantic introspection
    "TC002",   # ditto for third-party imports
    "TC003",   # ditto for stdlib imports
    "N818",    # Exception suffix — AppException is the explicit base class
    "RUF012",  # ClassVar — SQLAlchemy Base uses type_annotation_map as a class-level dict
    "COM812",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "S105", "S106"]
"alembic/env.py" = ["E402"]
"alembic/versions/*.py" = ["E501", "D"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy: static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# Fixtures and tests share one event loop per test, so a connection opened in a
# fixture is always used from the loop that created it.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "unit: marks tests as unit tests",
    "mongodb: needs a reachable MongoDB server (skipped when absent)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/app"]
omit = ["*/alembic/*", "*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
